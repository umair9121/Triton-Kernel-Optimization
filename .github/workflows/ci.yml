name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests benchmarks examples scripts
      - name: Tests (CPU only; GPU tests are skipped)
        run: python -m pytest -q -rs

  reports:
    name: lint and render fixture kernels
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Lint captured kernels (SARIF)
        run: tritonlens lint tests/fixtures --format sarif -o tritonlens.sarif
      - name: Lint captured kernels (text)
        run: tritonlens lint tests/fixtures --min-severity warning
      - name: Render HTML reports
        run: tritonlens analyze tests/fixtures -o site
      - uses: actions/upload-artifact@v4
        with:
          name: tritonlens-reports
          path: |
            site/
            tritonlens.sarif
